name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          changelog = Path('CHANGELOG.md').read_text()
          section = next((part for part in changelog.split('\n## ')[1:] if part.startswith(tag + ' - ')), None)
          if section is None:
              raise SystemExit(f'No changelog entry for {tag}')
          Path('release-notes.md').write_text(section.split('\n', 1)[1].strip() + '\n')
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
